# Source of truth for checks: runs on commit locally and, via `just ci`, in CI.
# Only system hooks, no remote repos: those build a Python virtualenv per repo at
# run time, which cannot seed under devbox's Nix Python. biome covers formatting.
repos:
  - repo: local
    hooks:
      - id: lint
        name: lint
        entry: just lint
        language: system
        pass_filenames: false
        always_run: true
      - id: test
        name: test
        entry: just test
        language: system
        pass_filenames: false
        always_run: true
      - id: validate
        name: validate
        entry: just validate
        language: system
        pass_filenames: false
        always_run: true
      - id: plugin-test
        name: plugin-test
        entry: just plugin-test
        language: system
        pass_filenames: false
        always_run: true
